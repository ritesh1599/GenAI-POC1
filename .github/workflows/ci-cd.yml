name: GenAI RCA CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install faiss-cpu

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 smartrca --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 smartrca --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run pytest
        run: |
          pip install pytest
          python -m pip install -e .
          pytest tests/ --maxfail=1 --disable-warnings -q

      - name: Build RCA package
        run: |
          echo "Building SmartRCA package..."
          mkdir -p build
          cp -r smartrca build/
          cp cli.py build/
          echo "Build complete."

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload build artifacts to S3
        run: |
          BUCKET_NAME=genai-rca-artifacts
          echo "Uploading build folder to S3 bucket: $BUCKET_NAME"
          aws s3 sync build/ s3://$BUCKET_NAME/builds/ --delete
